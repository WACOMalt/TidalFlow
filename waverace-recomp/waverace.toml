# Config file for Wave Race 64 NTSC Recompilation.
[input]
entrypoint = 0x80046800
symbols_file_path = "./waverace.syms.toml"
rom_file_path = "waverace.us.z64"
output_func_path = "RecompiledFuncs"
use_absolute_symbols = true
relocatable_sections_path = "waverace.overlays.txt"

[patches]
# ALL problematic functions go here - N64Recomp generates empty stubs
# This includes: CACHE/COP0/BREAK instructions AND overlay-calling functions
stubs = [
    # RSP MMIO access functions - read/write to 0xA410000C (SP_STATUS)
    "func_800C5DA0",  # __osSpGetStatus - reads SP_STATUS register (MMIO)
    "func_800C6300",  # __osSpSetStatus - writes to RSP hardware register

    # Libultra internal scheduling functions (access __osActiveQueue at 0x800E9010)
    "func_800CBF20",  # __osGetActiveQueue - accesses libultra internal state
    # NOTE: osSetThreadPri, osCreateViManager, osCreatePiManager, osViBlack - now named in syms.toml for runtime redirect

